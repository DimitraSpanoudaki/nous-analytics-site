<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nous Analytics — Sites, αυτοματισμοί, marketing και δεδομένα</title>
    <meta name="description" content="Κατασκευή sites σε WordPress, αυτοματοποιήσεις εργασιών με AI, digital marketing και business analytics για επιχειρήσεις. Θεσσαλονίκη." />
    <meta property="og:title" content="Nous Analytics" />
    <meta property="og:description" content="Sites σε WordPress, αυτοματισμοί με AI, digital marketing και business analytics." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="el_GR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Φόρμες για το Netlify Forms. Πρέπει να υπάρχουν στο στατικό HTML ώστε το Netlify να τις εντοπίσει. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
